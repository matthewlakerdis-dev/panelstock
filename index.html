<style>
  html, body { margin: 0; padding: 0; background: #f5f5f4; height: 100%; }
  #root { min-height: 100vh; min-height: 100dvh; }
  /* Shared button foundation. Pills, badges and app-chrome controls keep their intentional shapes. */
  button { font-family: inherit; transition: background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, box-shadow .15s ease; }
  button:not([class*="rounded-full"]):not([class*="rounded-xl"]):not([class*="rounded-2xl"]) { border-radius: 8px !important; }
  button:focus-visible, label:has(>input[type="file"]):focus-within { outline: 3px solid #67e8f9 !important; outline-offset: 2px; }
  button:disabled { opacity: .4 !important; cursor: not-allowed !important; }
  button:not(:disabled) { cursor: pointer; }
  button:not(:disabled):active { transform: translateY(1px); }
  button:has(> svg > polyline[points="3 6 5 6 21 6"]) { display: grid; place-items: center; border: 0 !important; background: transparent !important; color: #dc2626 !important; line-height: 1; }
  .ps-split-picker-form button:has(> svg > polyline[points="3 6 5 6 21 6"]) { align-self: end; margin-bottom: 12px; }

<style id="panelstock-entry-layouts">
.ps-entry{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:20px;margin-bottom:20px;color:#0f172a}
.ps-entry h2{font-size:14px;font-weight:600;margin:0 0 8px}.ps-entry-intro{font-size:12px;color:#64748b;margin:0 0 20px}
.ps-entry-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:16px;align-items:start}.ps-catalog-grid{grid-template-columns:1fr 1fr .58fr 2.02fr}
.ps-entry label{display:block;min-width:0;font-size:12px;color:#475569}.ps-entry label>input{margin-top:6px}
.ps-entry input{width:100%;min-width:0;height:42px;padding:10px 12px;border:1px solid #dbe3ef;border-radius:8px;font-size:14px;background:white}
.ps-entry input[type="checkbox"]{width:18px;height:18px;margin:0;padding:0}
.ps-entry input:focus{outline:2px solid #cce4eb;outline-offset:1px}.ps-entry-rows{min-width:0}.ps-entry-row,.ps-entry-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 30px;gap:16px;align-items:center}
.ps-entry-row{margin-bottom:8px}.ps-entry-columns{font-size:12px;color:#475569;margin-bottom:6px}.ps-entry-columns>span{min-width:0}
.ps-cnc-row{grid-template-columns:minmax(90px,.8fr) minmax(110px,1fr) minmax(160px,1.35fr) 30px}.ps-cnc-row>input:nth-child(3){padding-left:14px;padding-right:14px}
.ps-cnc-single-row{grid-template-columns:minmax(100px,.8fr) minmax(120px,1fr) minmax(180px,1.4fr)}
.ps-cnc-schedule-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ps-split-picker-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:16px 24px;align-items:start}
.ps-split-picker-form>:first-child{grid-column:1;grid-row:1/span 20}.ps-split-picker-form>:not(:first-child){grid-column:2}
.border-b.pb-4:has(> .w-8.h-8.rounded.mb-2){display:flow-root;min-height:53px}
.border-b.pb-4>.w-8.h-8.rounded.mb-2{float:left;margin:0 12px 0 0}
.text-sm.text-neutral-400.pb-4.border-b{min-height:53px}
@media(max-width:540px){.ps-cnc-single-row{grid-template-columns:1fr 1fr}.ps-cnc-single-row>label:last-child{grid-column:1/-1}}
.ps-catalog-row{grid-template-columns:repeat(3,minmax(0,1fr)) 30px;gap:10px}.ps-single-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.ps-entry-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}.ps-entry-primary{background:#155e75;color:white;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600}.ps-entry-primary:hover:not(:disabled){background:#164e63}.ps-entry-primary:disabled{opacity:.4;cursor:not-allowed}.ps-entry-cancel{color:#475569;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600}.ps-entry-cancel:hover:not(:disabled){background:#f8fafc}
@media(max-width:1023px){section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1024px){section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(1){grid-column:1;grid-row:1}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(2){grid-column:1;grid-row:2}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(3){grid-column:1;grid-row:3}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(4){grid-column:1;grid-row:4}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(5){grid-column:1;grid-row:5}section.mt-4.rounded-xl.border.border-slate-300.bg-white.p-5.space-y-4>.grid.grid-cols-2.gap-3>:nth-child(6){grid-column:2;grid-row:1/span 5}}
.ps-entry-add{border:1px solid #155e75;color:#155e75;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-top:8px}.ps-entry-trash{color:#dc2626;width:30px;height:42px;display:grid;place-items:center}.ps-entry-note{font-size:12px;color:#64748b;margin-top:12px}.ps-entry-errors{background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px;margin-top:12px;font-size:13px}
.ps-measure{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center;padding:20px;background:#f0f7f9;border:1px solid #cee1e7;border-radius:12px;margin-bottom:20px}.ps-measure h3{font-size:14px;font-weight:600;margin:0 0 8px}.ps-measure p{font-size:13px;line-height:1.5;color:#475569;margin:5px 0}.ps-measure svg{display:block;width:100%;height:auto;max-height:190px}.ps-measure-compact{gap:12px;padding:14px;margin:16px 0}.ps-measure-compact h3{font-size:13px}.ps-measure-compact p{font-size:12px}
@media(max-width:900px){.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr 1fr}.ps-entry-rows{grid-column:1/-1}}
@media(max-width:540px){.ps-entry{padding:16px}.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr}.ps-entry-row,.ps-entry-columns{gap:8px}.ps-catalog-row{gap:6px}.ps-catalog-row input{padding:9px 6px;font-size:12px}.ps-entry-columns{font-size:11px}.ps-measure{gap:8px;padding:12px}.ps-measure p{font-size:11px}.ps-measure h3{font-size:12px}}

/* Forms also adapt to the available content width beside desktop navigation. */
.ps-entry{container-type:inline-size}
@container (max-width:820px){.ps-catalog-grid{grid-template-columns:1fr 1fr 1fr}.ps-catalog-grid>.ps-entry-rows{grid-column:1/-1}}
@container (max-width:620px){.ps-entry-grid{grid-template-columns:1fr 1fr}.ps-entry-rows{grid-column:1/-1}}
@container (max-width:620px){.ps-cnc-schedule-grid{grid-template-columns:1fr}}
@media(max-width:900px){.ps-split-picker-form{grid-template-columns:1fr}.ps-split-picker-form>:first-child,.ps-split-picker-form>:not(:first-child){grid-column:1;grid-row:auto}}
@container (max-width:440px){.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr}.ps-cnc-row{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.35fr) 26px}.ps-cnc-row>.ps-entry-trash{width:26px}.ps-catalog-row input{padding:9px 6px;font-size:12px}.ps-entry-row,.ps-entry-columns{gap:8px}.ps-entry-columns{font-size:11px}}

/* Place catalog guidance between shared material details and size entry. */
.ps-catalog-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.65fr)}
.ps-catalog-grid>.ps-measure,.ps-catalog-grid>.ps-entry-rows{grid-column:1/-1}
.ps-catalog-grid>.ps-measure{margin:0}
.ps-measure{grid-template-columns:1fr;gap:16px;align-items:start}
.ps-measure svg{max-width:520px;max-height:220px;margin:0 auto}
@container (max-width:620px){.ps-catalog-grid{grid-template-columns:1fr 1fr}.ps-catalog-grid>label:last-of-type{grid-column:1/-1}}
@container (max-width:440px){.ps-catalog-grid{grid-template-columns:1fr}.ps-measure{grid-template-columns:1fr}.ps-measure svg{max-height:none}}
@media(max-width:540px){.ps-measure{grid-template-columns:1fr;gap:10px}.ps-measure svg{max-height:none}.ps-measure h3{font-size:13px}.ps-measure p{font-size:12px}}
</style>

<div id="root">
  <div style="padding:60px 20px;text-align:center;color:#78716c;font-family:system-ui,sans-serif;">Loading PanelStock…</div>
</div>
<script>
  window.onerror = function (message, source, lineno, colno, err) {
    var errorText = String(message || (err && err.message) || '');
    if (/ResizeObserver loop (?:limit exceeded|completed with undelivered notifications)/i.test(errorText)) {
      return true;
    }
    var root = document.getElementById('root');
    var msg = (err && err.stack) ? err.stack : String(message);
    root.innerHTML =
      '<div style="padding:20px;font-family:system-ui,sans-serif;">' +
      '<h2 style="color:#7f1d1d;margin-bottom:8px;">PanelStock failed to load</h2>' +
      '<p style="color:#57534e;font-size:14px;margin-bottom:12px;">Copy the error below and send it back to Claude to fix it.</p>' +
      '<pre style="padding:14px;background:#fef2f2;color:#7f1d1d;white-space:pre-wrap;font-family:monospace;font-size:12px;border-radius:8px;overflow:auto;">' +
      msg.replace(/</g, '&lt;') + '</pre></div>';
    return true;
  };
</script>
