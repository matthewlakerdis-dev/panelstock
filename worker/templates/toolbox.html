@container toolbox-main (max-width:500px){

}

function view(p,preserveScroll=p==='talk'&&page==='talk'){const scroll=preserveScroll?{top:window.scrollY,left:window.scrollX,behavior:'instant'}:null,focusId=preserveScroll?document.activeElement?.id:null;if(!actor)return loginView();page=p;if(p==='admin'&&!actor.isAdmin)return notify('Administrator access required.');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+p).classList.add('active');document.getElementById('main').innerHTML=p==='talk'?talkHTML():p==='admin'?adminHTML():recordsHTML();if(scroll){if(focusId)document.getElementById(focusId)?.focus?.({preventScroll:true});window.scrollTo(scroll)}}
function talkHTML(){const d=state.draft;return `<div class="row between toolbox-talk-heading"><div><span class="toolbox-heading-label">Safety briefing</span><h2>${d.type==='daily'?'Daily pre-start':'Weekly toolbox talk'}</h2><span class="muted">Prepare, discuss and record the agreed next steps.</span></div><span class="tag">DRAFT</span></div><div class="card"><div class="row toolbox-new-talk"><button onclick="newTalk('daily')">+ New daily pre-start</button><button onclick="newTalk('weekly')">+ New weekly talk</button></div><p class="muted toolbox-new-talk-help">New talks use your admin templates. Save this draft before starting another talk.</p><div class="grid">${input('company','Company')}${input('site','Workshop / project *')}${input('date','Date *','date')}${input('time','Start time *','time')}${input('facilitator','Facilitator *')}${input('focus',d.type==='weekly'?'Weekly focus topic *':'Shift / team')}</div>${d.type==='daily'&&d.topics.length===3?'':`<label for="tasks" style="margin-top:16px">${d.type==='daily'?'Today’s tasks and changed conditions *':'Work and changes this week'}</label><textarea id="tasks" oninput="field('tasks',this.value)">${esc(d.tasks)}</textarea>`}</div>${d.type==='daily'?prestartHTML(d):''}<div class="card toolbox-discussion"><h3>Talking points &amp; discussion</h3><p class="muted">Edit the talking points for this session and record the crew’s comments and agreed controls.</p>${d.topics.map((t,i)=>`<section class="topic" aria-labelledby="topic-title${i}"><h3 class="topic-heading" id="topic-title${i}"><span class="toolbox-topic-number">${String(i+1).padStart(2,'0')}</span>${sectionTitles(d)[i]}</h3><div class="grid"><div><label for="point${i}">Admin talking points</label><textarea id="point${i}" oninput="topic(${i},'text',this.value)">${esc(t.text)}</textarea></div><div><label for="note${i}">${d.type==='daily'&&d.topics.length===3?dailyTitles[i]+(i===0?' *':''):'Comments / discussion / agreed controls'}</label><textarea id="note${i}" placeholder="Record the team’s comments…" oninput="topic(${i},'notes',this.value)">${esc(t.notes)}</textarea></div></div></section>`).join('')}</div><div class="card"><div class="row between toolbox-section-heading"><h3>Attendance & signatures</h3><button onclick="invalidateAll();state.draft.people.push({name:'',userUsername:'',ack:false,signature:null});persist();view('talk')">+ Add attendee</button></div><p class="muted">Once the discussion is finished, pass this device to each attendee to sign beside their name. ${d.type==='weekly'?'By signing, they acknowledge the issues discussed as understood and confirm an opportunity to ask questions.':'By signing, they confirm attendance and an opportunity to ask questions.'}</p>${d.people.length?d.people.map((p,i)=>`<div class="person"><div class="row">${attendeeSelect(p,i)}<button aria-label="Remove attendee ${i+1}" onclick="invalidateAll();state.draft.people.splice(${i},1);persist();view('talk')">Remove</button></div><div class="row signature-status">${p.signature?`<img class="signature-image" src="${esc(p.signature.image)}" alt="Signature of ${esc(p.name)}"><small>${esc(stamp(p.signature.at))}</small>`:""}<button onclick="openSignature(${i})">${p.signature?"Sign again":"Attendee sign"}</button></div></div>`).join(''):'<p class="empty">Add the people attending this talk.</p>'}</div><div class="card"><div class="row between toolbox-section-heading"><h3>Follow-up actions</h3><button onclick="invalidateAll();state.draft.actions.push({text:'',owner:'',due:'',closed:false});persist();view('talk')">+ Add action</button></div><p class="muted">Assign an owner and due date. Address any unsafe condition before the affected task starts.</p>${d.actions.map((a,i)=>`<div class="action"><label for="act${i}">Action ${i+1}</label><textarea id="act${i}" oninput="action(${i},'text',this.value)">${esc(a.text)}</textarea><div class="grid"><div><label for="owner${i}">Owner</label><input id="owner${i}" value="${esc(a.owner)}" oninput="action(${i},'owner',this.value)"></div><div><label for="due${i}">Due date</label><input id="due${i}" type="date" value="${esc(a.due)}" oninput="action(${i},'due',this.value)"></div></div><button onclick="invalidateAll();state.draft.actions.splice(${i},1);persist();view('talk')">Remove action</button></div>`).join('')||'<p class="empty">No actions added.</p>'}</div><div class="card toolbox-signoff"><h3>Supervisor sign-off</h3><p>I confirm I conducted this talk and recorded the attendance, discussion and agreed actions.</p>${d.supervisorSignature?`<img class="signature-image" src="${esc(d.supervisorSignature.image)}" alt="Supervisor signature"><p class="muted signature-time">${esc(d.facilitator)} · ${esc(stamp(d.supervisorSignature.at))}</p>`:""}<button onclick="openSignature('supervisor')">${d.supervisorSignature?"Sign again":"Supervisor sign"}</button></div><details class="card toolbox-export"><summary>Export or download a copy</summary><div><p class="notice">Download the completed PDF in the daily pre-start or weekly toolbox form layout, then upload the file to your OneDrive folder. OneDrive upload is manual.</p><div class="row"><button onclick="pdf(state.draft)">Download PDF</button><button onclick="downloadReport(state.draft)">Download record</button></div></div></details><div class="actions toolbox-actions" aria-label="Save talk"><button onclick="saveDraft()">Save draft</button><button class="primary" onclick="completeTalk()">Complete &amp; save record</button></div>`}
function newTalk(type){if(busy)return notify('Wait for the save to finish.');if(!confirm('Start a new talk? Unsaved changes to the current talk will be replaced.'))return;state.draft=fresh(type);persist();view('talk',false);window.scrollTo({top:0,left:0,behavior:'instant'})}
async function completeTalk(){prepareDiscussion();const d=state.draft;if(d.type==='daily'&&d.prestart?.checklist.some(v=>!v))return notify('Answer all pre-start inspection questions before completing.');if(!d.site.trim()||!d.facilitator.trim()||!d.date||!d.time||(d.type==='daily'&&!d.tasks.trim())||(d.type==='weekly'&&!d.focus.trim()))return notify('Fill in the required session details marked with *.');if(d.topics.some(t=>!t.reviewed||!t.text.trim()))return notify('Add the talking points for this session.');if(!d.people.length||d.people.some(p=>!p.name.trim()||!p.ack||!p.signature))return notify('Add attendees and collect each attendee’s signature.');if(d.actions.some(a=>!a.text.trim()||!a.owner.trim()||!a.due))return notify('Each action needs a description, owner and due date.');if(!d.supervisorSignature)return notify('Collect the supervisor’s final sign-off.');await saveRecord(true);}
function adminHTML(){return `<h2>Admin templates</h2><p class="muted">Prepare recurring talking points for new talks. Changes do not alter existing talks or saved records.</p>${['daily','weekly'].map(type=>`<div class="card"><h3>${type==='daily'?'Daily pre-start':'Weekly toolbox talk'}</h3>${(type==='daily'?dailyTitles:titles).map((title,i)=>`<label for="${type}${i}" style="margin-top:16px">${title}</label><textarea id="${type}${i}" oninput="state.templates.${type}[${i}]=this.value;persist()">${esc(state.templates[type][i])}</textarea>`).join('')}</div>`).join('')}<div class="notice"><button class="primary" onclick="saveTemplates()">Save shared templates</button> <button onclick="reloadTemplates()">Reload shared templates</button><p>Template edits apply to new talks after you save. Adapt the prompts to your workplace procedures and risk assessments.</p></div>`}
function recordsHTML(){return `<div class="row between"><div><h2>Saved records</h2><p class="muted">${totalRecords} matching shared records · ${openActionTotal} open actions</p></div><button onclick="refreshRecords()">Refresh records</button></div><div class="card"><h3>Outstanding actions</h3><p class="muted">Showing ${openActions.length} actions on this page.</p>${openActions.length?openActions.map(a=>`<div class="person"><strong>${esc(a.text)}</strong><p class="muted">${esc(a.site)} · ${esc(a.owner)} · Due ${esc(a.due)}</p><button onclick="closeAction('${esc(a.record)}',${a.index},${a.revision})">Mark resolved</button></div>`).join(''):'<p class="empty">No outstanding actions on this page.</p>'}${pageControls(nextActionPage)}</div><div class="card"><label for="search">Search records</label><input id="search" value="${esc(searchTerm)}" placeholder="Workshop, facilitator, date or topic…" oninput="filterRecords(this.value)"><div id="records-list">${recordRows(state.records)}</div><div id="record-pagination">${pageControls(nextRecordPage)}</div></div><div class="notice">Completed talks are preserved in PanelStock. Action resolution is tracked separately. Download the signed copy and upload it to OneDrive.</div>`}
function pageControls(next){return `<div class="row" style="margin-top:15px">${recordPage>0?'<button onclick="loadPage('+Math.max(0,recordPage-25)+')">Previous page</button>':''}${next!==null?'<button onclick="loadPage('+next+')">Next page</button>':''}</div>`}
function recordRows(rows){return rows.length?[...rows].reverse().map(r=>`<div class="person"><div class="row between"><strong>${r.type==='daily'?'Daily pre-start':'Weekly toolbox talk'} · ${esc(r.date)}</strong><span class="tag">${esc(r.status)}</span></div><p class="muted">${esc(r.site)} · ${esc(r.facilitator)} · ${r.people.length} attendees${r.focus?' · '+esc(r.focus):''}</p><div class="row">${r.status==='Draft'?`<button onclick="openDraft('${esc(r.id)}')">Edit draft</button>`:''}<button onclick="exportRecord('${esc(r.id)}','pdf')">Download PDF</button><button onclick="exportRecord('${esc(r.id)}','html')">Download record</button></div></div>`).join(''):'<p class="empty">No matching records.</p>'}
function filterRecords(q){searchTerm=q;clearTimeout(filterRecords.timer);filterRecords.timer=setTimeout(()=>loadPage(0,true),300)}
async function openDraft(id){if(!confirm('Open this shared draft? Current unsaved changes will be replaced.'))return;try{const data=await api('/toolbox/records/'+id);state.draft=data.record;persist();view('talk')}catch(e){notify(e.message)}}
async function closeAction(id,index,revision){try{await api('/toolbox/records/'+id+'/resolve',{mutationId:crypto.randomUUID(),expectedRevision:revision,actionIndex:index});await loadPage(recordPage);notify('Action resolution saved in PanelStock.')}catch(e){notify(e.message)}}
function stamp(s){return s?new Date(s).toLocaleString('en-AU',{timeZone:'Australia/Brisbane'})+' AEST':'—'}
function report(d){return `<article class="report"><small>FABRICATION TOOLBOX · ${esc(d.status.toUpperCase())}</small><h1>${d.type==='daily'?'Daily pre-start':'Weekly toolbox talk'}</h1><p><strong>Company:</strong> ${esc(d.company)}<br><strong>Workshop / project:</strong> ${esc(d.site)}<br><strong>Date / time:</strong> ${esc(d.date)} ${esc(d.time)}<br><strong>Facilitator:</strong> ${esc(d.facilitator)}<br><strong>Focus / team:</strong> ${esc(d.focus)}</p>${d.type==='daily'||d.prestart?`<h2>Pre-start inspection</h2><table>${prestartQuestions.map((q,i)=>`<tr><td>${esc(q)}</td><td>${esc(d.prestart?.checklist[i]||'Not recorded')}</td></tr>`).join('')}</table><h2>High-risk activities</h2><p>${esc(d.prestart?.highRisk)||'Not recorded.'}</p><h2>Issues from the previous shift</h2><p>${esc(d.prestart?.previousShift)||'Not recorded.'}</p>`:''}<h2>Work and changed conditions</h2><p>${esc(d.tasks)||'None recorded.'}</p>${d.topics.map((t,i)=>`<section><h2>${i+1}. ${sectionTitles(d)[i]}</h2><strong>Comments / discussion / agreed controls</strong><p>${esc(t.notes)||'None recorded.'}</p></section>`).join('')}<h2>Attendance & signatures</h2><p>Each attendee signed on the supervisor’s device to acknowledge attendance and an opportunity to ask questions.</p><table><thead><tr><th>Name</th><th>Signature / time</th></tr></thead><tbody>${d.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.signature?`<img src="${esc(p.signature.image)}" alt="Signature of ${esc(p.name)}" style="width:180px;height:60px;object-fit:contain"><br>${esc(stamp(p.signature.at))}`:'Not signed'}</td></tr>`).join('')||'<tr><td colspan="2">No attendees recorded.</td></tr>'}</tbody></table><h2>Follow-up actions</h2>${d.actions.map((a,i)=>`<section><p><strong>${i+1}. ${esc(a.text)}</strong><br>Owner: ${esc(a.owner)} · Due: ${esc(a.due)}<br>Status: ${a.closed?'Resolved '+stamp(a.resolvedAt):'Open'}</p></section>`).join('')||'<p>No actions recorded.</p>'}<h2>Supervisor sign-off</h2><p>I confirm I conducted this talk and recorded the attendance, discussion and agreed actions.</p><p>${esc(d.facilitator)}</p>${d.supervisorSignature?`<img src="${esc(d.supervisorSignature.image)}" alt="Supervisor signature" style="width:200px;height:70px;object-fit:contain"><p>${esc(stamp(d.supervisorSignature.at))}</p>`:"<p>Not signed</p>"}<hr><p><small>Record ID: ${esc(d.id)}<br>Completed: ${stamp(d.completedAt)}<br>Exported: ${stamp(new Date().toISOString())}<br>Use workplace procedures and risk assessments for task-specific requirements.</small></p></article>`}
async function pdf(d){try{notify('Preparing PDF…');const bytes=await ToolboxPdf.createPdf(structuredClone(d));download(filename(d)+'.pdf',bytes,'application/pdf');notify('PDF downloaded. Upload the file to OneDrive.')}catch(e){notify('PDF export failed: '+e.message)}}
function filename(d){return [d.date,d.site||'workshop',d.type==='daily'?'Daily-Prestart':'Weekly-Toolbox',d.status,d.id.slice(0,8)].join('_').replace(/[^a-zA-Z0-9_.-]/g,'-')}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function downloadReport(d){download(filename(d)+'.html','<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(filename(d))+'</title><style>body{max-width:850px;margin:35px auto;padding:0 24px;font:14px Arial;line-height:1.5;color:#172a32}h2{font-size:18px;margin-top:25px}p{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbc8cd;padding:8px;text-align:left}section{break-inside:avoid}@page{size:A4;margin:16mm}</style>'+report(d)+'</html>','text/html');notify('Record downloaded. Upload the file to OneDrive.');}
async function backup(){if(busy)return;busy=true;try{const records=[],snapshot=await api('/toolbox/export-index',{});for(const id of snapshot.ids){records.push((await api('/toolbox/records/'+id)).record);notify('Exporting '+records.length+' of '+snapshot.ids.length+' shared records…');}download('PanelStock-Toolbox-Records_'+today()+'.json',JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),templates:snapshot.templates,records},null,2),'application/json');notify('Shared records exported. Store this backup securely.')}catch(e){notify(e.message)}finally{busy=false}}
function downloadDraft(){download('PanelStock-Toolbox-Draft_'+today()+'.json',JSON.stringify(state.draft,null,2),'application/json')}
async function restoreFile(input){try{const file=input.files[0];if(!file)return;if(file.size>5000000)throw Error('Choose a draft under 5 MB');const d=JSON.parse(await file.text());if(!validRecord(d)||d.status!=='Draft')throw Error('Choose a valid toolbox draft backup');if(!confirm('Replace the current device draft? Shared records will be unchanged until you save.'))return;state.draft=d;persist();view('talk');notify('Draft recovered on this device.')}catch(e){notify(e.message)}finally{input.value=''}}
function loginView(){document.querySelector('nav').inert=true;const url=toolboxApp==='web'?'https://web.panelstockhq.com':'https://app.panelstockhq.com';document.getElementById('main').innerHTML=`<div class="card"><h2>Open from PanelStock</h2><p>Open Toolbox Talks from the PanelStock menu to use your existing sign-in.</p><a href="${url}">Open PanelStock</a></div>`;document.getElementById('logout').hidden=true;document.getElementById('signed-in').textContent='';}
async function receivePanelstockSession(){const parameters=new URLSearchParams(location.hash.slice(1)),ticket=parameters.get('ticket');if(ticket){history.replaceState(null,'',location.pathname+location.search);token='';sessionStorage.removeItem(sessionKey);try{const session=await api('/toolbox/session',{ticket,app:toolboxApp});token=session.token;sessionStorage.setItem(sessionKey,token);await startSession()}catch(e){loginView();notify(e.message)}}else if(token)await startSession();else loginView()}

async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body===undefined?undefined:JSON.stringify(body)});let data;try{data=await r.json()}catch{throw Error('PanelStock returned an unexpected response. No save was confirmed.')};if(!r.ok){if(r.status===401){actor=null;token='';sessionStorage.removeItem(sessionKey);loginView()}throw Error(data.error||'No successful save was confirmed.')}return data}

async function startSession(){try{const session=await api('/session');if(!session.isAdmin&&!session.taskAccess?.['factory.toolbox']){token='';sessionStorage.removeItem(sessionKey);throw Error('Ask your PanelStock administrator to enable Run toolbox talks for your account.')}const directory=await api('/toolbox/users');attendeeUsers=directory.users||[];actor={...session,displayName:attendeeUsers.find(u=>u.username===session.username)?.displayName||session.username};document.querySelector('nav').inert=false;key='panelstock-toolbox-v1:'+actor.username;state={templates:{daily:[...daily],weekly:[...weekly]},records:[],draft:null};const local=localStorage.getItem(key);if(local){try{const data=JSON.parse(local),cached={templates:data.templates,draft:data.draft,records:[]};if(validState(cached))state=cached;else notify('The saved device draft is invalid. Recover a draft backup if needed.')}catch{notify('The saved device draft could not be loaded. Recover a draft backup if needed.')}}const hadDraft=!!state.draft;await reloadTemplates(false);if(!hadDraft)state.draft=fresh();await loadPage(0,false);document.getElementById('nav-admin').hidden=!actor.isAdmin;document.getElementById('logout').hidden=false;document.getElementById('signed-in').textContent=actor.username;view('talk')}catch(e){actor=null;loginView();notify(e.message)}}
async function logout(){if(busy)return notify('Wait for the current operation to finish.');if(!persist()&&!confirm('The device draft could not be saved. Log out anyway?'))return;try{await api('/logout',{})}catch(e){notify(e.message)}token='';actor=null;attendeeUsers=[];sessionStorage.removeItem(sessionKey);loginView()}
async function reloadTemplates(render=true){try{const data=await api('/toolbox/templates');state.templates=data.templates;templateRevision=data.revision;if(render)view('admin')}catch(e){notify(e.message);throw e}}
async function saveTemplates(){if(!actor?.isAdmin)return;if(busy)return;busy=true;try{const data=await api('/toolbox/templates',{templates:state.templates,expectedRevision:templateRevision});templateRevision=data.revision;state.templates=data.templates;persist();notify('Shared templates saved.')}catch(e){notify(e.message)}finally{busy=false}}
async function loadPage(offset=0,render=true){const generation=++searchGeneration;try{const data=await api('/toolbox/list',{offset,search:searchTerm});if(generation!==searchGeneration)return;state.records=data.records;recordPage=offset;totalRecords=data.total;openActions=data.openActions;openActionTotal=data.openActionTotal;nextRecordPage=data.nextOffset;nextActionPage=data.actionNextOffset;if(render){const focused=document.activeElement?.id==='search',caret=focused?document.activeElement.selectionStart:null;view('records');if(focused){const search=document.getElementById('search');search.focus();search.setSelectionRange(caret,caret)}}}catch(e){notify(e.message)}}
async function refreshRecords(){if(!actor)return loginView();await loadPage(0)}
async function exportRecord(id,format){try{const r=(await api('/toolbox/records/'+id)).record;if(format==='pdf')await pdf(r);else downloadReport(r)}catch(e){notify(e.message)}}
async function saveDraft(){await saveRecord(false)}
async function saveRecord(complete){if(busy)return;busy=true;document.querySelector('.shell').inert=true;const d=state.draft;try{const record=structuredClone(d);delete record.pendingSave;record.status=complete?'Completed':'Draft';const packet={record,expectedRevision:d.revision||0,mutationId:crypto.randomUUID()};const fingerprint=JSON.stringify({record,expectedRevision:packet.expectedRevision});if(d.pendingSave?.fingerprint===fingerprint)packet.mutationId=d.pendingSave.mutationId;d.pendingSave={fingerprint,mutationId:packet.mutationId};persist();const data=await api('/toolbox/records/'+d.id,packet);if(complete)state.draft=fresh(d.type);else{const revision=data.record.revision,changed=toolboxContent(d)!==toolboxContent(record);state.draft=changed?{...d,revision,pendingSave:null}:{...data.record,pendingSave:null}}persist();if(complete){await loadPage(0);view('records')}notify(complete?'Signed record saved in PanelStock. Export a copy for OneDrive.':'Draft saved in PanelStock.')}catch(e){notify(e.message+' Your device draft has been retained.')}finally{busy=false;document.querySelector('.shell').inert=false}}

async function contentHash(r){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(toolboxContent(r)));return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('')}
let signing=null,ink=false,activePointer=null;
function openSignature(target){prepareDiscussion();const d=state.draft;if(d.type==='daily'&&d.prestart?.checklist.some(v=>!v))return notify('Answer all pre-start inspection questions before signing.');if(!d.site.trim()||!d.facilitator.trim()||(d.type==='daily'?!d.tasks.trim():!d.focus.trim())||d.topics.some(t=>!t.reviewed||!t.text.trim())||!d.people.length||d.people.some(p=>!p.name.trim())||d.actions.some(a=>!a.text.trim()||!a.owner.trim()||!a.due))return notify('Finish the talk details, discussion, attendee names and actions before signing.');const name=target==='supervisor'?d.facilitator:d.people[target]?.name;if(!name?.trim())return notify('Enter the signer’s name first.');if(target==='supervisor'&&(!d.people.length||d.people.some(p=>!p.signature)))return notify('Collect attendee signatures before the supervisor sign-off.');signing=target;document.getElementById('sign-title').textContent=name;document.getElementById('sign-statement').textContent=target==='supervisor'?'I confirm I conducted this talk and recorded attendance, discussion and agreed actions.':(d.type==='weekly'?'I attended this toolbox talk, understand the issues discussed and had an opportunity to ask questions and raise concerns.':'I attended this talk and had an opportunity to ask questions and raise concerns.');document.getElementById('sign-dialog').showModal();const c=document.getElementById('signature-pad');c.width=1000;c.height=350;clearPad();}
function clearPad(){const c=document.getElementById('signature-pad'),ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#172c35';ctx.fillStyle='#172c35';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ink=false;activePointer=null;}
async function saveSignature(){if(!ink)return notify('Draw a signature before saving.');const signature={image:document.getElementById('signature-pad').toDataURL('image/png'),at:new Date().toISOString(),contentHash:await contentHash(state.draft)};if(signing==='supervisor')state.draft.supervisorSignature=signature;else{state.draft.people[signing].signature=signature;state.draft.people[signing].ack=true;state.draft.supervisorSignature=null;}persist();document.getElementById('sign-dialog').close();view('talk');}
const pad=document.getElementById('signature-pad');
function point(e){const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]}
pad.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;pad.setPointerCapture(e.pointerId);const ctx=pad.getContext('2d'),[x,y]=point(e);ctx.beginPath();ctx.arc(x,y,2,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.moveTo(x,y);ink=true;});
pad.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();const ctx=pad.getContext('2d');ctx.lineTo(...point(e));ctx.stroke();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,e=>{if(e.pointerId===activePointer){activePointer=null;persist();}});

receivePanelstockSession();
</script>
