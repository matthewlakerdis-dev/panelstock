name: Verify production PDF scanner
on:
  push:
    branches: [main]
    paths:
      - 'converter/**'
      - '.github/workflows/verify-converter-production.yml'
concurrency:
  group: panelstock-converter-verification
  cancel-in-progress: false
jobs:
  verify-converter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Railway deployed the PDF scanner
        run: |
          python - <<'PYTHON'
          import ast
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          module = ast.parse(Path('converter/safety_pdf.py').read_text())
          version = next(ast.literal_eval(node.value) for node in module.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == 'SCANNER_VERSION' for target in node.targets))
          revision = os.environ['GITHUB_SHA']
          expected_tree = subprocess.check_output(['git', 'rev-parse', f'{revision}:converter'], text=True).strip()
          deployed_trees = {}
          url = 'https://panelstock-pdf-converter-production.up.railway.app/health'
          for attempt in range(30):
              try:
                  request = Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'PanelStock-release-verifier/1.0'})
                  with urlopen(request, timeout=15) as response:
                      health = json.load(response)
                  if health.get('ok') is not True or health.get('safetyScanner') != version:
                      raise ValueError('Updated PDF scanner is not serving yet')
                  deployed_revision = health.get('revision')
                  if not isinstance(deployed_revision, str) or not re.fullmatch(r'[0-9a-f]{40}', deployed_revision):
                      raise ValueError('PDF converter did not report a valid source revision')
                  if deployed_revision != revision:
                      # The automatic legacy bundle can supersede this commit.
                      # Accept it only when every converter source file matches.
                      if deployed_revision not in deployed_trees:
                          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', deployed_revision],
                                         check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          deployed_trees[deployed_revision] = subprocess.check_output(
                              ['git', 'rev-parse', f'{deployed_revision}:converter'], text=True).strip()
                      if deployed_trees[deployed_revision] != expected_tree:
                          raise ValueError('PDF converter is serving different converter source files')
                  print(f'Verified production scanner: {version}; revision: {deployed_revision}; converter tree: {expected_tree}', flush=True)
                  break
              except Exception as error:
                  if attempt == 29:
                      raise
                  print(f'Waiting for Railway PDF scanner deployment ({attempt + 1}/30): {type(error).__name__}', flush=True)
                  time.sleep(15)
          PYTHON
