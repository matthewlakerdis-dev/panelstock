name: Build legacy iOS client
on:
  push:
    branches: [main]
    paths:
      - 'panelstock-client.modern.js'
      - 'site/app.js'
      - 'panelstock-app.modern.js'
      - '.github/workflows/build-legacy-client.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save @babel/core @babel/cli @babel/preset-env core-js@3
          cat > babel.legacy.json <<'EOF'
          {
            "presets": [["@babel/preset-env", {
              "targets": {"ie": "11"},
              "modules": false
            }]]
          }
          EOF
          npx babel panelstock-client.modern.js --out-file /tmp/client.js --config-file ./babel.legacy.json
          npx babel site/app.js --out-file /tmp/site-app.js --config-file ./babel.legacy.json
          npx babel panelstock-app.modern.js --out-file /tmp/main-app.js --config-file ./babel.legacy.json
          cat > /tmp/polyfills.js <<'EOF'
          (function(){
            if(!Object.fromEntries)Object.fromEntries=function(entries){var o={};for(var i=0;i<entries.length;i++)o[entries[i][0]]=entries[i][1];return o;};
            if(!Array.prototype.flatMap)Array.prototype.flatMap=function(fn,thisArg){return Array.prototype.concat.apply([],this.map(fn,thisArg));};
            if(!String.prototype.padStart)String.prototype.padStart=function(n,s){s=String(s||' ');var v=String(this);while(v.length<n)v=s+v;return v.slice(-n);};
            if(!window.queueMicrotask)window.queueMicrotask=function(fn){Promise.resolve().then(fn);};
            if(!window.crypto)window.crypto={};
            if(!window.crypto.randomUUID)window.crypto.randomUUID=function(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16);});};
            if(!Element.prototype.replaceChildren)Element.prototype.replaceChildren=function(){while(this.firstChild)this.removeChild(this.firstChild);for(var i=0;i<arguments.length;i++)this.appendChild(arguments[i]);};
            if(!Element.prototype.remove)Element.prototype.remove=function(){if(this.parentNode)this.parentNode.removeChild(this);};
            if(!window.AbortSignal)window.AbortSignal={};
            if(!window.AbortSignal.timeout)window.AbortSignal.timeout=function(){return undefined;};
          })();
          EOF
          cat /tmp/polyfills.js /tmp/client.js > panelstock-client.legacy.js
          cat /tmp/polyfills.js /tmp/site-app.js > site/app.legacy.js
          cat /tmp/polyfills.js /tmp/main-app.js > panelstock-app.legacy.js
      - name: Verify legacy syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['panelstock-client.legacy.js','site/app.legacy.js','panelstock-app.legacy.js'];
          const sources=files.map(function(file){return [file,fs.readFileSync(file,'utf8')];});
          const strip=function(s){return s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'').replace(/(['\"])(?:\\.|(?!\1).)*\1/g,'');};
          const bad=[
            [/\?\./,'optional chaining'],
            [/\?\?/,'nullish coalescing'],
            [/=>/,'arrow functions'],
            [/\bconst\b/,'const'],
            [/\blet\b/,'let']
          ];
          for(const pair of sources){for(const badPair of bad){if(badPair[0].test(strip(pair[1]))){console.error(pair[0]+' still contains '+badPair[1]);process.exit(1);}}}
          console.log('Legacy syntax check passed');
          NODE
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panelstock-client.legacy.js site/app.legacy.js panelstock-app.legacy.js
          git diff --cached --quiet && exit 0
          git commit -m "Build legacy iOS PanelStock client"
          git push
