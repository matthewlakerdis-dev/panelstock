name: Fix damage 007 photo rule
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow Missing Panel 007 without photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/src/store.js')
          s=p.read_text()
          old="check(Array.isArray(c.after.photoIds)&&c.after.photoIds.length>0&&c.after.photoIds.every(id=>photos.has(id)),'Damage requires saved photos');"
          new="check(c.after.reasonCode==='007'||(Array.isArray(c.after.photoIds)&&c.after.photoIds.length>0&&c.after.photoIds.every(id=>photos.has(id))),'Damage requires saved photos');"
          if old not in s:
              raise SystemExit('Expected photo validation not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run tests
        working-directory: worker
        run: npm ci && npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/store.js
          git commit -m "Allow damage code 007 without photo"
          git push
