name: Inspect native database monitoring
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-database-monitor.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read only fixed numeric monitoring measurements
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!token)throw Error('Monitoring inspection credentials are unavailable');
          async function sql(query){
            const response=await fetch('https://api.cloudflare.com/client/v4/analytics/sql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();
            if(!response.ok||data.success===false||data.errors?.length)throw Error('Numeric monitoring inspection failed HTTP '+response.status);
            const rows=data.data||data.result?.data;if(!Array.isArray(rows))throw Error('Numeric monitoring inspection returned an invalid shape');return rows;
          }
          const fields=['metricsAvailable','collectedAtMs','asOfMs','utcDayStartMs','dayWrites','dayReads','hourWrites','projectedDayWrites','dailyWarning','forecastWarning','runtimeFailureWarning','memoryErrors','cpuErrors','internalErrors','unavailableCode'];
          const source=" FROM logs.workersLogs WHERE accountTag='"+account+"' AND scriptName='panelstock-reports' AND attributes['event']='database_usage_metrics'";
          const rows=await sql("SELECT attributes['state'] AS state, "+fields.map(key=>"attributes['"+key+"'] AS "+key).join(', ')+source+" AND timestamp >= NOW() - INTERVAL '60' MINUTE ORDER BY timestamp DESC LIMIT 3");
          const safe=rows.map(row=>{
            if(!['normal','warning','unavailable'].includes(row.state))throw Error('Monitoring state is invalid');
            const result={state:row.state};
            for(const key of fields){if(row[key]===null||row[key]===undefined)continue;const raw=row[key],value=typeof raw==='string'&&/^[0-9]+$/.test(raw)?Number(raw):raw;if(!Number.isSafeInteger(value)||value<0)throw Error('Monitoring numeric field is invalid');result[key]=value;}
            return result;
          });
          console.log('Recent fixed monitoring measurements: '+JSON.stringify(safe));
          const counts=await sql("SELECT COUNT(*) AS value"+source+" AND attributes['state']='unavailable' AND timestamp >= NOW() - INTERVAL '30' MINUTE");
          const raw=counts[0]?.value,value=typeof raw==='string'&&/^[0-9]+$/.test(raw)?Number(raw):raw;
          if(!Number.isSafeInteger(value)||value<0)throw Error('Unavailable sample count is invalid');
          console.log('Unavailable samples remaining in alert window: '+value);

          const namespaceResponse=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/durable_objects/namespaces',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const namespaceData=await namespaceResponse.json();
          if(!namespaceResponse.ok||namespaceData.success===false||namespaceData.errors?.length||!Array.isArray(namespaceData.result))throw Error('Production namespace metadata is unavailable');
          const namespaces=namespaceData.result.filter(value=>value.script==='panelstock-reports'&&value.class==='InventoryStore');
          if(namespaces.length!==1||!/^[a-f0-9]{32}$/i.test(namespaces[0].id||''))throw Error('Production namespace is not uniquely identified');
          const through=Date.now()-300000,since=Math.max(Date.parse('2026-11-22T01:53:00.000Z'),through-86400000);
          const query='query ProductionRuntimeHealth($account:String!,$namespace:String!,$since:Time!,$until:Time!){viewer{accounts(filter:{accountTag:$account}){durableObjectsPeriodicGroups(limit:1,filter:{namespaceId:$namespace,datetime_geq:$since,datetime_leq:$until}){sum{rowsWritten rowsRead exceededMemoryErrors exceededCpuErrors fatalInternalErrors activeTime}}}}}';
          const healthResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{account,namespace:namespaces[0].id,since:new Date(since).toISOString(),until:new Date(through).toISOString()}}),signal:AbortSignal.timeout(20000)});
          const healthData=await healthResponse.json(),accounts=healthData.data?.viewer?.accounts;
          if(!healthResponse.ok||healthData.errors?.length||!Array.isArray(accounts)||accounts.length!==1)throw Error('Production aggregate runtime metrics are unavailable');
          const groups=accounts[0]?.durableObjectsPeriodicGroups,numericFields=['rowsWritten','rowsRead','exceededMemoryErrors','exceededCpuErrors','fatalInternalErrors','activeTime'];
          if(!Array.isArray(groups)||groups.length!==1||numericFields.some(key=>!Number.isSafeInteger(groups[0]?.sum?.[key])||groups[0].sum[key]<0))throw Error('Production aggregate runtime metrics are invalid');
          console.log('Observed production runtime window: '+JSON.stringify({from:new Date(since).toISOString(),through:new Date(through).toISOString(),metrics:Object.fromEntries(numericFields.map(key=>[key,groups[0].sum[key]]))}));

          async function graph(query,variables){
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,...(variables?{variables}:{})}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();if(!response.ok||data.errors?.length)throw Error('Aggregate runtime inspection is unavailable');return data.data;
          }
          const schema=await graph('{dimensions:__type(name:"AccountDurableObjectsPeriodicGroupsDimensions"){fields{name}} maximum:__type(name:"AccountDurableObjectsPeriodicGroupsMax"){fields{name description}}}');
          if(schema.dimensions?.fields?.some(value=>value.name==='datetimeHour')){
            const memoryMaximum=schema.maximum?.fields?.find(value=>value.name==='memoryUsageBytes');
            console.log('Sampled maximum memory metric available: '+Boolean(memoryMaximum));
            const bucketQuery='query RuntimeHours($account:String!,$namespace:String!,$since:Time!,$until:Time!){viewer{accounts(filter:{accountTag:$account}){durableObjectsPeriodicGroups(limit:100,filter:{namespaceId:$namespace,datetime_geq:$since,datetime_leq:$until}){dimensions{datetimeHour}sum{rowsWritten rowsRead exceededMemoryErrors exceededCpuErrors fatalInternalErrors activeTime}'+(memoryMaximum?'max{memoryUsageBytes}':'')+'}}}}';
            const bucketsData=await graph(bucketQuery,{account,namespace:namespaces[0].id,since:new Date(since).toISOString(),until:new Date(through).toISOString()});
            const buckets=bucketsData.viewer?.accounts?.[0]?.durableObjectsPeriodicGroups;
            if(!Array.isArray(buckets))throw Error('Hourly runtime metrics are unavailable');
            const safe=buckets.map(value=>{
              const hour=Date.parse(value.dimensions?.datetimeHour);
              if(!Number.isFinite(hour)||numericFields.some(key=>!Number.isSafeInteger(value.sum?.[key])||value.sum[key]<0))throw Error('Hourly runtime metrics are invalid');
              const row={hour:new Date(hour).toISOString(),...Object.fromEntries(numericFields.map(key=>[key,value.sum[key]]))};
              if(memoryMaximum){if(!Number.isSafeInteger(value.max?.memoryUsageBytes)||value.max.memoryUsageBytes<0)throw Error('Sampled maximum memory metric is invalid');row.sampledMaximumMemoryBytes=value.max.memoryUsageBytes;}
              return row;
            }).sort((a,b)=>a.hour.localeCompare(b.hour));
            console.log('Hourly production runtime metrics: '+JSON.stringify(safe));
          }else console.log('Hourly runtime dimension is unavailable; no event-level logs were fetched.');
          JS
