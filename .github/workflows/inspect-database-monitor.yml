name: Inspect native database monitoring
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-database-monitor.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read only fixed numeric monitoring measurements
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!token)throw Error('Monitoring inspection credentials are unavailable');
          async function sql(query){
            const response=await fetch('https://api.cloudflare.com/client/v4/analytics/sql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();
            if(!response.ok||data.success===false||data.errors?.length)throw Error('Numeric monitoring inspection failed HTTP '+response.status);
            const rows=data.data||data.result?.data;if(!Array.isArray(rows))throw Error('Numeric monitoring inspection returned an invalid shape');return rows;
          }
          const fields=['metricsAvailable','collectedAtMs','asOfMs','utcDayStartMs','dayWrites','dayReads','hourWrites','projectedDayWrites','dailyWarning','forecastWarning','runtimeFailureWarning','memoryErrors','cpuErrors','internalErrors','unavailableCode'];
          const source=" FROM logs.workersLogs WHERE accountTag='"+account+"' AND scriptName='panelstock-reports' AND attributes['event']='database_usage_metrics'";
          const rows=await sql("SELECT attributes['state'] AS state, "+fields.map(key=>"attributes['"+key+"'] AS "+key).join(', ')+source+" AND timestamp >= NOW() - INTERVAL '60' MINUTE ORDER BY timestamp DESC LIMIT 3");
          const safe=rows.map(row=>{
            if(!['normal','warning','unavailable'].includes(row.state))throw Error('Monitoring state is invalid');
            const result={state:row.state};
            for(const key of fields){if(row[key]===null||row[key]===undefined)continue;const raw=row[key],value=typeof raw==='string'&&/^[0-9]+$/.test(raw)?Number(raw):raw;if(!Number.isSafeInteger(value)||value<0)throw Error('Monitoring numeric field is invalid');result[key]=value;}
            return result;
          });
          console.log('Recent fixed monitoring measurements: '+JSON.stringify(safe));
          const counts=await sql("SELECT COUNT(*) AS value"+source+" AND attributes['state']='unavailable' AND timestamp >= NOW() - INTERVAL '30' MINUTE");
          const raw=counts[0]?.value,value=typeof raw==='string'&&/^[0-9]+$/.test(raw)?Number(raw):raw;
          if(!Number.isSafeInteger(value)||value<0)throw Error('Unavailable sample count is invalid');
          console.log('Unavailable samples remaining in alert window: '+value);
          JS
