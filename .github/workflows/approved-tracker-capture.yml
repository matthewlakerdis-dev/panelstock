name: Approved tracker download error capture
on:
  push:
    branches: [codex/tracker-download-capture]
    paths: [.github/workflows/approved-tracker-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, 'Run approved 90-second tracker capture')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Capture approved redacted errors for at most 90 seconds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          trap 'rm -f /tmp/approved-tracker-tail.json /tmp/approved-tracker-tail.stderr' EXIT
          set +e
          timeout 90s npx wrangler tail --config wrangler.production.jsonc --format json > /tmp/approved-tracker-tail.json 2>/tmp/approved-tracker-tail.stderr
          result=$?
          set -e
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urlsplit
          def scrub(value):
              text=str(value or '')
              text=re.sub(r'https?://[^\s<>]+','[url]',text,flags=re.I)
              text=re.sub(r'\b(?:Bearer\s+|(?:token|tracker|ticket|authorization)\s*[:=]\s*)[^\s,;]+','[credential]',text,flags=re.I)
              text=re.sub(r'\b[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\b','[id]',text,flags=re.I)
              text=re.sub(r'\b[a-f0-9]{32,}\b','[id]',text,flags=re.I)
              text=re.sub(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b','[email]',text,flags=re.I)
              text=re.sub(r'(["\x27`])[^\n]*?\1','[quoted value]',text)
              return re.sub(r'[\r\n\t]+',' ',text)[:400]
          raw=Path('/tmp/approved-tracker-tail.json').read_text();decoder=json.JSONDecoder();count=0;events=0
          while raw:
              start=raw.find('{')
              if start<0:break
              raw=raw[start:]
              try:event,end=decoder.raw_decode(raw)
              except ValueError:raw=raw[1:];continue
              raw=raw[end:]
              if not isinstance(event,dict):continue
              events+=1
              for log in event.get('logs',[]):
                  message=log.get('message',[])
                  if not isinstance(message,list) or len(message)<2 or message[0]!='worker_request_failed':continue
                  details=message[1]
                  if isinstance(details,str):
                      try:details=json.loads(details)
                      except ValueError:continue
                  if not isinstance(details,dict) or details.get('path')!='/cnc-tracker':continue
                  fields={key:scrub(details.get(key)) for key in ['name','detail','cause'] if key in details}
                  fields['stage']=details.get('stage') if details.get('stage') in ['workbook-data','pdf-links','workbook-build'] else 'unknown'
                  fields.update(path='/cnc-tracker',retryable=details.get('retryable') is True,overloaded=details.get('overloaded') is True)
                  print(json.dumps(fields));count+=1
              request=(event.get('event') or {}).get('request') or {}
              if urlsplit(request.get('url','')).path=='/cnc-tracker':
                  for error in event.get('exceptions',[]):
                      print(json.dumps({'path':'/cnc-tracker','name':scrub(error.get('name')),'detail':scrub(error.get('message'))}));count+=1
          print('Captured redacted download errors:',count)
          if not events:print('Tail startup:',scrub(Path('/tmp/approved-tracker-tail.stderr').read_text()))
          PY
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then exit "$result"; fi
