name: Database write usage
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scripts/database-write-monitor.mjs'
      - 'worker/scripts/test/database-write-monitor.test.mjs'
      - '.github/workflows/monitor-database-writes.yml'
permissions:
  contents: read
concurrency:
  group: database-write-usage
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify usage aggregation, forecasting and unavailable-telemetry handling
        run: node --test worker/scripts/test/database-write-monitor.test.mjs
      - name: Read database write usage and flag early warnings
        run: node worker/scripts/database-write-monitor.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_DAILY_WRITE_WARNING: '80000'
          DATABASE_DAILY_WRITE_FORECAST_REFERENCE: '100000'
