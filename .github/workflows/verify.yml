name: Verify coordinated release
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify safety PDF scanner
        working-directory: .
        run: |
          python -m pip install pdfplumber==0.11.7
          python -m unittest discover -s converter -p test_safety_pdf.py
          python -m py_compile converter/server.py converter/safety_pdf.py
