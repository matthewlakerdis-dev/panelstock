name: Mobile sync recovery v2
on: [push]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch pending sync banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('panelstock-client.js')
          s = p.read_text()
          old = "if(outbox.pending()){el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fff7ed;color:#7c2d12;padding:8px;text-align:center;font:14px system-ui;pointer-events:none';el.textContent=status==='syncing'?'Saving pending stock changes…':'Changes saved on this device — waiting to sync';}"
          new = """if(outbox.pending()){
        el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fff7ed;color:#7c2d12;padding:8px;text-align:center;font:14px system-ui;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap';
        const text=document.createElement('span');
        text.textContent=status==='syncing'?'Saving pending stock changes…':(message||'Changes saved on this device — waiting to sync');
        el.appendChild(text);
        if(status!=='syncing'){
          const retry=document.createElement('button');
          retry.type='button';
          retry.textContent='Retry sync';
          retry.style.cssText='padding:6px 10px;border:1px solid #9a3412;border-radius:7px;background:#fff;color:#7c2d12;font:600 13px system-ui';
          retry.onclick=async()=>{retry.disabled=true;retry.textContent='Retrying…';message='';await outbox.flush(session?.username);renderNotice();};
          el.appendChild(retry);
        }
      }"""
          if old not in s:
              raise SystemExit('pending banner source not found')
          s = s.replace(old, new, 1)
          s = s.replace("try{res=await this.send(packet,owner);}catch{this.notify('offline');return false;}", "try{res=await this.send(packet,owner);}catch(error){this.notify('offline','Sync failed: '+(error && error.message ? error.message : 'Network request failed.'));return false;}", 1)
          s = s.replace("}else this.notify(res.status===401?'login':'offline');", "}else this.notify(res.status===401?'login':'offline','Sync failed (HTTP '+res.status+').');", 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panelstock-client.js
          git commit -m "Add retry control to mobile pending sync banner"
          git push
