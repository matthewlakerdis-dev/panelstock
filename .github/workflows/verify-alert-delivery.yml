name: Verify monitoring alert delivery
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send one marked test to the existing Cloudflare alert email destination'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-alert-delivery.yml'
permissions:
  contents: read
concurrency:
  group: panelstock-alert-delivery-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the existing alert destination without changing any policy
        run: node worker/scripts/verify-alert-delivery.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicit opt-in; reruns only inspect history and never repeat a test.
          SEND_MONITOR_TEST: ${{ github.run_attempt == 1 && ((github.event_name == 'workflow_dispatch' && inputs.send_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-monitor-alert-once]'))) && 'true' || 'false' }}
