name: Inspect Cloudflare alert access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cloudflare-alerts.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read alert capabilities without changing settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw Error('Existing Cloudflare deployment credentials are unavailable');
          async function read(label,path){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const data=await r.json();
            console.log(label+': HTTP '+r.status+', success='+String(data.success));
            if(!r.ok||data.success===false){console.log(label+' error codes: '+JSON.stringify((data.errors||[]).map(x=>x.code)));return null;}
            return data.result;
          }
          const verificationResponse=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const verification=await verificationResponse.json();
          if(verificationResponse.ok&&verification.success&&/^[a-f0-9]{32}$/i.test(verification.result?.id||'')){
            const id=verification.result.id;
            console.log('Connected token public ID: '+id+'; status='+verification.result.status);
            const detailsResponse=await fetch('https://api.cloudflare.com/client/v4/user/tokens/'+id,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const details=await detailsResponse.json();
            if(detailsResponse.ok&&details.success)console.log('Connected token metadata: '+JSON.stringify({name:details.result?.name,issued_on:details.result?.issued_on,modified_on:details.result?.modified_on}));
            else console.log('Token detail access: HTTP '+detailsResponse.status);
          }else{
            console.log('User token identity access: HTTP '+verificationResponse.status);
            const identity=await read('Account token identity','/tokens/verify');
            if(identity&&/^[a-f0-9]{32}$/i.test(identity.id||'')){
              console.log('Connected account token public ID: '+identity.id+'; status='+identity.status);
              const detail=await read('Account token detail','/tokens/'+identity.id);
              if(detail)console.log('Connected account token metadata: '+JSON.stringify({name:detail.name,issued_on:detail.issued_on,modified_on:detail.modified_on}));
            }
          }
          const available=await read('Alert capabilities','/alerting/v3/available_alerts');
          if(available)console.log('Available alert definitions: '+JSON.stringify(available));
          const policies=await read('Existing policies','/alerting/v3/policies');
          if(policies)console.log('Existing policy summary: '+JSON.stringify((Array.isArray(policies)?policies:[]).map(p=>({alert_type:p.alert_type,enabled:p.enabled,mechanismTypes:Object.keys(p.mechanisms||{})}))));
          const subscriptions=await read('Account subscriptions','/subscriptions');
          if(subscriptions)console.log('Service plans: '+JSON.stringify(subscriptions.map(p=>({state:p.state,product:p.rate_plan?.public_name||p.rate_plan?.id||null}))));
          const schemaResponse=await fetch('https://api.cloudflare.com/client/v4/analytics/sql/introspection?account_tag='+encodeURIComponent(account)+'&include_columns=true',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const schema=await schemaResponse.json();
          console.log('SQL analytics access: HTTP '+schemaResponse.status);
          if(schemaResponse.ok&&schema.success!==false){
            const datasets=schema.result?.datasets||schema.datasets||[];
            console.log('SQL dataset names: '+JSON.stringify(datasets.map(value=>value.name)));
            console.log('Database SQL dataset definitions: '+JSON.stringify(datasets.filter(value=>/durable|sqlite|storage/i.test(value.name||'')).map(value=>({name:value.name,columns:value.columns}))));
          }else console.log('SQL analytics error codes: '+JSON.stringify((schema.errors||[]).map(value=>value.code)));
          const until=new Date().toISOString(),since=until.slice(0,10)+'T00:00:00Z';
          const query='query DatabaseWrites($account:String!,$since:Time!,$until:Time!){viewer{accounts(filter:{accountTag:$account}){durableObjectsPeriodicGroups(limit:1,filter:{datetime_geq:$since,datetime_leq:$until}){sum{rowsWritten rowsRead}}}}}';
          const usageResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{account,since,until}}),signal:AbortSignal.timeout(20000)});
          const usage=await usageResponse.json();
          console.log('GraphQL database usage access: HTTP '+usageResponse.status);
          if(usage.errors?.length)console.log('GraphQL database usage errors: '+JSON.stringify(usage.errors.map(value=>({message:String(value.message||'').replaceAll(account,'[account]'),path:value.path}))));
          else console.log('Database usage aggregate: '+JSON.stringify(usage.data?.viewer?.accounts?.map(value=>value.durableObjectsPeriodicGroups)));
          const introspectionQuery='{__type(name:"AccountDurableObjectsPeriodicGroupsSum"){fields{name description}}}';
          const fieldsResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:introspectionQuery}),signal:AbortSignal.timeout(20000)});
          const fields=await fieldsResponse.json();
          console.log('Periodic metric schema: '+JSON.stringify(fields.data?.__type?.fields||fields.errors?.map(value=>({message:value.message}))));
          const namespaces=await read('Durable Object namespaces','/workers/durable_objects/namespaces');
          const byId=new Map((Array.isArray(namespaces)?namespaces:[]).map(value=>[value.id,{script:value.script,className:value.class,useSqlite:value.use_sqlite}]));
          const recentFrom=new Date(Date.now()-20*60000).toISOString(),recentUntil=new Date(Date.now()-5*60000).toISOString();
          const attributionQuery='query MemoryAttribution($account:String!,$since:Time!,$until:Time!){viewer{accounts(filter:{accountTag:$account}){durableObjectsPeriodicGroups(limit:1000,filter:{datetime_geq:$since,datetime_leq:$until}){dimensions{namespaceId}sum{exceededMemoryErrors exceededCpuErrors fatalInternalErrors rowsWritten}}}}}';
          const attributedResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:attributionQuery,variables:{account,since:recentFrom,until:recentUntil}}),signal:AbortSignal.timeout(20000)});
          const attributed=await attributedResponse.json();
          if(attributed.errors?.length)console.log('Memory attribution unavailable: '+JSON.stringify(attributed.errors.map(value=>({message:String(value.message||'').replaceAll(account,'[account]')}))));
          else console.log('Memory errors by service: '+JSON.stringify(attributed.data?.viewer?.accounts?.flatMap(value=>(value.durableObjectsPeriodicGroups||[]).map(group=>({service:byId.get(group.dimensions?.namespaceId)||{unmapped:true},metrics:group.sum})))));
          console.log('Runtime log dataset columns: '+JSON.stringify((schema.result?.datasets||schema.datasets||[]).filter(value=>value.name==='logs.workersLogs'||value.name==='logs.issues').map(value=>({name:value.name,columns:value.columns}))));
          async function sqlRead(label,query,params){
            const response=await fetch('https://api.cloudflare.com/client/v4/analytics/sql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,params}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();
            console.log(label+': HTTP '+response.status);
            if(response.ok&&!data.errors?.length)console.log(label+' aggregate: '+JSON.stringify(data.data||data.result?.data||[]));
            else console.log(label+' error codes: '+JSON.stringify((data.errors||[]).map(value=>value.code)));
          }
          await sqlRead('Recent Durable Object invocation outcomes','SELECT scriptName, status, COUNT(*) AS events FROM events.durableObjectsInvocations WHERE accountTag=$account AND timestamp >= $start GROUP BY scriptName, status ORDER BY events DESC LIMIT 30',{account,start:new Date(Date.now()-15*60000).toISOString()});
          await sqlRead('Recent Worker outcome counts',"SELECT scriptName, attributes['$workers.outcome'] AS outcome, COUNT(*) AS events FROM logs.workersLogs WHERE accountTag=$account AND timestamp >= $start AND logType='cf-worker-event' GROUP BY scriptName, outcome ORDER BY events DESC LIMIT 30",{account,start:new Date(Date.now()-15*60000).toISOString()});
          const routeResponse=await fetch('https://api.cloudflare.com/client/v4/analytics/sql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:"SELECT transactionName, invocationType, httpStatus, attributes['$workers.outcome'] AS outcome, COUNT(*) AS events FROM logs.workersLogs WHERE accountTag=$account AND timestamp >= $start AND logType='cf-worker-event' GROUP BY transactionName, invocationType, httpStatus, outcome ORDER BY events DESC LIMIT 500",params:{account,start:new Date(Date.now()-15*60000).toISOString()}}),signal:AbortSignal.timeout(20000)});
          const routes=await routeResponse.json(),routeGroups=new Map();
          const methods=['readPublicCncExcelData','readPublicTrackerWorkbookData','readPublicSiteOrders','readPublicGateProgress','readPublicSchedule','httpResponse','qaResponse','handle','compactQaEvidence','scheduledData','stocktakeReportingCorrectionStatus'];
          const paths=['cnc-tracker','tv','data','session','login','qa','schedule','dispatch','orders','toolbox','workshop-stock','production','admin','profile','cad'];
          for(const row of routes.data||routes.result?.data||[]){
            const label=String(row.transactionName||'');
            const method=methods.find(value=>label.includes(value))||'other';
            const route=paths.find(value=>label.includes('/'+value))||'other';
            const safe={route,method,type:row.invocationType,status:row.httpStatus,outcome:row.outcome},key=JSON.stringify(safe);
            routeGroups.set(key,{...safe,events:(routeGroups.get(key)?.events||0)+Number(row.events||0)});
          }
          console.log('Sanitized runtime routes: HTTP '+routeResponse.status+'; aggregates='+JSON.stringify([...routeGroups.values()].sort((a,b)=>b.events-a.events)));
          await sqlRead('Fixed runtime route categories',"SELECT CASE WHEN url LIKE '%/cnc-tracker%' THEN 'cnc-tracker' WHEN url LIKE '%/tv/%' OR url LIKE '%tv.panelstockhq.com/data%' THEN 'tv' WHEN url LIKE '%/session%' THEN 'session' WHEN url LIKE '%/data%' THEN 'data' WHEN url LIKE '%/schedule%' THEN 'schedule' WHEN url LIKE '%/toolbox%' THEN 'toolbox' WHEN url LIKE '%/qa%' THEN 'qa' ELSE 'other' END AS route, invocationType, httpStatus, attributes['$workers.outcome'] AS outcome, COUNT(*) AS events FROM logs.workersLogs WHERE accountTag=$account AND timestamp >= $start AND logType='cf-worker-event' GROUP BY route, invocationType, httpStatus, outcome ORDER BY events DESC LIMIT 100",{account,start:new Date(Date.now()-15*60000).toISOString()});
          await sqlRead('Fixed RPC method categories',"SELECT CASE WHEN invocationLabel LIKE '%readPublicSchedule%' THEN 'readPublicSchedule' WHEN invocationLabel LIKE '%httpResponse%' THEN 'httpResponse' WHEN invocationLabel LIKE '%qaResponse%' THEN 'qaResponse' WHEN invocationLabel LIKE '%readPublicCnc%' THEN 'readPublicCnc' WHEN invocationLabel LIKE '%readPublicTracker%' THEN 'readPublicTracker' WHEN invocationLabel LIKE '%readPublicSiteOrders%' THEN 'readPublicSiteOrders' WHEN invocationLabel LIKE '%readPublicGateProgress%' THEN 'readPublicGateProgress' WHEN invocationLabel LIKE '%handle%' THEN 'handle' ELSE 'other' END AS method, invocationType, attributes['$workers.outcome'] AS outcome, COUNT(*) AS events FROM logs.workersLogs WHERE accountTag=$account AND timestamp >= $start AND logType='cf-worker-event' GROUP BY method, invocationType, outcome ORDER BY events DESC LIMIT 100",{account,start:new Date(Date.now()-15*60000).toISOString()});
          const sizeFields=['qaBytes','qaChunks','ordersBytes','ordersChunks','photosBytes','photosChunks','workshopBytes','workshopChunks','transactionsBytes','transactionsChunks','cncBytes','cncChunks'];
          const sizeQuery="SELECT timestamp, "+sizeFields.map(key=>"attributes['"+key+"'] AS "+key).join(', ')+" FROM logs.workersLogs WHERE accountTag=$account AND scriptName='panelstock-reports' AND timestamp >= $start AND attributes['event']='inventory_storage_sizes' ORDER BY timestamp DESC LIMIT 3";
          const sizeResponse=await fetch('https://api.cloudflare.com/client/v4/analytics/sql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:sizeQuery,params:{account,start:new Date(Date.now()-30*60000).toISOString()}}),signal:AbortSignal.timeout(20000)});
          const sizeData=await sizeResponse.json(),sizeRows=sizeData.data||sizeData.result?.data||[];
          const numericSizes=sizeRows.map(row=>Object.fromEntries(sizeFields.flatMap(key=>{const value=row[key];return (typeof value==='number'||typeof value==='string'&&/^[0-9]+$/.test(value))&&Number.isSafeInteger(Number(value))&&Number(value)>=0?[[key,Number(value)]]:[];}))).filter(row=>Object.keys(row).length);
          console.log('Fixed numeric storage diagnostics: HTTP '+sizeResponse.status+'; values='+JSON.stringify(numericSizes));
          if(!numericSizes.length)console.log('Fixed numeric storage diagnostics are not yet available; no raw log messages are fetched or displayed.');
          const deploymentTiming=await read('Current deployment timing','/workers/scripts/panelstock-reports/deployments');
          const activeDeployment=deploymentTiming?.deployments?.[0]||(Array.isArray(deploymentTiming)?deploymentTiming[0]:null);
          const currentNamespace=(Array.isArray(namespaces)?namespaces:[]).find(value=>value.script==='panelstock-reports'&&value.class==='InventoryStore');
          const afterAt=Date.parse(activeDeployment?.created_on||'')+30000,throughAt=Date.now()-5*60000;
          if(currentNamespace&&Number.isFinite(afterAt)&&throughAt-afterAt>=2*60000){
            const postQuery='query RuntimeAfterDeployment($account:String!,$namespace:String!,$since:Time!,$until:Time!){viewer{accounts(filter:{accountTag:$account}){durableObjectsPeriodicGroups(limit:1,filter:{namespaceId:$namespace,datetime_geq:$since,datetime_leq:$until}){sum{rowsWritten rowsRead exceededMemoryErrors exceededCpuErrors fatalInternalErrors activeTime}}}}}';
            const postResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:postQuery,variables:{account,namespace:currentNamespace.id,since:new Date(afterAt).toISOString(),until:new Date(throughAt).toISOString()}}),signal:AbortSignal.timeout(20000)});
            const postData=await postResponse.json();
            if(postData.errors?.length)console.log('Post-deployment telemetry unavailable: '+JSON.stringify(postData.errors.map(value=>({message:String(value.message||'').replaceAll(account,'[account]').replaceAll(currentNamespace.id,'[namespace]')}))));
            else console.log('Post-deployment production metrics: '+JSON.stringify({from:new Date(afterAt).toISOString(),through:new Date(throughAt).toISOString(),groups:postData.data?.viewer?.accounts?.flatMap(value=>value.durableObjectsPeriodicGroups||[])}));
          }else console.log('Post-deployment telemetry window is not yet sufficiently complete; no health conclusion drawn.');
          console.log('Read-only inspection complete. No notification or billing settings were changed.');
          JS
