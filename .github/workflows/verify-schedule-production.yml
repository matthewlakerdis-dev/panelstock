name: Verify production schedule handlers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scripts/verify-cnc-undo-deployment.mjs'
      - '.github/workflows/verify-schedule-production.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production code without changing orders or schedule entries
        run: node worker/scripts/verify-cnc-undo-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
