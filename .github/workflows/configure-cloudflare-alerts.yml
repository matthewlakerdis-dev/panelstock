name: Configure Cloudflare reliability alerts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scripts/configure-cloudflare-alerts.mjs'
      - '.github/workflows/configure-cloudflare-alerts.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-reliability-alert-configuration
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure approved alerts using existing email destinations
        run: node worker/scripts/configure-cloudflare-alerts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
