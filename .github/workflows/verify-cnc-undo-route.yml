name: Verify deployed CNC undo code
on:
  push:
    branches: [codex/cnc-undo-route-fix]
    paths:
      - 'worker/scripts/verify-cnc-undo-deployment.mjs'
      - '.github/workflows/verify-cnc-undo-route.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read production Worker code without changing stock or panels
        run: node worker/scripts/verify-cnc-undo-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
