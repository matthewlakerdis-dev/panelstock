name: Deploy production Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/src/**'
      - 'worker/test/**'
      - 'worker/wrangler.production.jsonc'
      - 'worker/wrangler.site-orders.jsonc'
      - 'worker/scripts/site-orders.mjs'
      - 'worker/templates/site-orders/**'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'site/**'
      - 'site-orders/**'
      - 'icon*.png'
      - '.github/workflows/deploy-worker-production.yml'
concurrency:
  group: panelstock-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and validate Site Orders
        run: |
          npm run build:site
          npx wrangler deploy --config wrangler.site-orders.jsonc --dry-run
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Site Orders custom domain
        run: npx wrangler deploy --config wrangler.site-orders.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed Site Orders assets
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import hashlib
          import time

          # Cloudflare may append its analytics beacon to otherwise unchanged HTML.
          # Keep every application node/attribute/text and ignore only that known script.
          def html_signature(contents):
              class Page(HTMLParser):
                  def __init__(self):
                      super().__init__(convert_charrefs=True)
                      self.nodes = []
                      self.beacon = False
                  def handle_decl(self, declaration):
                      self.nodes.append(('declaration', declaration.lower()))
                  def handle_starttag(self, tag, attrs):
                      source = urlsplit(dict(attrs).get('src') or '')
                      if tag == 'script' and source.hostname == 'static.cloudflareinsights.com' and (source.path == '/beacon.min.js' or source.path.startswith('/beacon.min.js/')):
                          self.beacon = True
                      else:
                          self.nodes.append(('start', tag, sorted(attrs)))
                  def handle_endtag(self, tag):
                      if tag == 'script' and self.beacon:
                          self.beacon = False
                      else:
                          self.nodes.append(('end', tag))
                  def handle_data(self, data):
                      if not self.beacon and data.strip():
                          self.nodes.append(('text', data.strip()))
              page = Page()
              page.feed(contents.decode('utf-8'))
              return page.nodes

          root = Path('dist-site-orders')
          assets = sorted(path for path in root.iterdir() if not path.name.startswith('_'))
          if not assets:
              raise SystemExit('No built Site Orders assets to verify')
          for path in assets:
              expected = path.read_bytes()
              digest = hashlib.sha256(expected).hexdigest()
              public_path = '' if path.name == 'index.html' else path.name
              url = f'https://site.panelstockhq.com/{public_path}?release={digest[:16]}'
              for attempt in range(3):
                  try:
                      request = Request(url, headers={
                          'Cache-Control': 'no-cache',
                          'User-Agent': 'PanelStock-release-verifier/1.0 (+https://github.com/matthewlakerdis-dev/panelstock)'
                      })
                      with urlopen(request, timeout=30) as response:
                          actual = response.read()
                      matches = html_signature(actual) == html_signature(expected) if path.name == 'index.html' else actual == expected
                      if not matches:
                          actual_digest = hashlib.sha256(actual).hexdigest()
                          print(f'Asset mismatch: {path.name}; expected={digest}; actual={actual_digest}; '
                                f'expected_bytes={len(expected)}; actual_bytes={len(actual)}', flush=True)
                          if path.name == 'index.html':
                              print(f'Deployed HTML nodes: {html_signature(actual)!r}'[:6000], flush=True)
                          raise ValueError(f'Deployed asset differs from build: {path.name}')
                      break
                  except Exception as error:
                      if attempt == 2:
                          if isinstance(error, HTTPError):
                              print(f'Public asset HTTP {error.code}: {path.name}; '
                                    f'server={error.headers.get("server", "unknown")}; '
                                    f'mitigation={error.headers.get("cf-mitigated", "none")}', flush=True)
                          raise
                      time.sleep(5)
              verification = 'HTML structure' if path.name == 'index.html' else f'SHA-256 {digest[:16]}'
              print(f'Verified {path.name}: {verification}', flush=True)
          PYTHON
# Trigger production deployment after adding workflow.
