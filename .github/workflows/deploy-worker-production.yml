name: Deploy production Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/src/**'
      - 'worker/wrangler.production.jsonc'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - '.github/workflows/deploy-worker-production.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
# Trigger production deployment after adding workflow.
