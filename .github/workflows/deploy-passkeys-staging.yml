name: Deploy staging (passkey trial paused)
on:
  push:
    branches: [codex/passkeys-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panelstock-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile
      - uses: actions/checkout@v4
        with:
          repository: matthewlakerdis-dev/panelstock-desktop
          ref: 82f37640b27587ba9c1f8bdc4cdb2088f2707c5d
          path: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/worker/package-lock.json
            desktop/package-lock.json
      - name: Verify Worker and mobile
        working-directory: mobile/worker
        run: npm ci && npm test
      - name: Verify and build desktop
        working-directory: desktop
        run: npm ci && npm test && node scripts/build-production.cjs
      - name: Package isolated staging apps
        run: node mobile/scripts/build-passkeys-staging.mjs desktop
      - name: Validate staging deployment
        working-directory: mobile/worker
        run: npx wrangler deploy --config wrangler.passkeys-staging.json --dry-run
      - name: Deploy only the staging Worker
        working-directory: mobile/worker
        run: npx wrangler deploy --config wrangler.passkeys-staging.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify staging assets and disabled passkey API
        run: |
          python - <<'PY'
          import hashlib,time,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          root=Path('mobile/dist-passkeys-staging')
          base='https://panelstock-reports-staging.matthewlakerdis.workers.dev/'
          for name in ['index.html','mobile/index.html','site/index.html','passkeys.js','mobile/site/passkeys.js','site/passkeys.js','site/app.js','mobile/panelstock-app.modern.js']:
              expected=(root/name).read_bytes()
              digest=hashlib.sha256(expected).hexdigest()
              for attempt in range(6):
                  try:
                      with urlopen(Request(base+name+'?release='+digest[:16],headers={'Cache-Control':'no-cache','User-Agent':'PanelStock-staging-verifier/1.0 (+https://github.com/matthewlakerdis-dev/panelstock)'}),timeout=30) as response:
                          actual=response.read()
                      if actual!=expected: raise ValueError('Staging asset differs from build: '+name)
                      print('Verified '+name)
                      break
                  except Exception as error:
                      if attempt==5:
                          if isinstance(error,HTTPError):
                              print('HTTP failure:',name,error.code,'server=',error.headers.get('server'),'mitigation=',error.headers.get('cf-mitigated'),flush=True)
                              print(error.read(600).decode('utf8','replace'),flush=True)
                          raise
                      time.sleep(5)
          for app in ['web','app','site']:
              request=Request(base+'passkeys/authenticate/options',data=json.dumps({'app':app}).encode(),headers={'Content-Type':'application/json','Origin':base.rstrip('/'),'User-Agent':'PanelStock-staging-verifier/1.0'})
              try:
                  with urlopen(request,timeout=30) as response:
                      raise ValueError('Staging passkeys are still enabled: '+app)
              except HTTPError as error:
                  if error.code!=404: raise
                  result=json.load(error)
                  if result.get('ok') or 'username and PIN' not in result.get('error',''):
                      raise ValueError('Unexpected disabled passkey response: '+app)
              print('Verified passkeys are disabled for staging: '+app)
          PY
          echo 'Web: https://panelstock-reports-staging.matthewlakerdis.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mobile: https://panelstock-reports-staging.matthewlakerdis.workers.dev/mobile/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Site: https://panelstock-reports-staging.matthewlakerdis.workers.dev/site/' >> "$GITHUB_STEP_SUMMARY"
